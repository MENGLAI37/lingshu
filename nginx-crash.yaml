apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: phase1-test
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - "echo '[FATAL] Cannot connect to database: connection refused'; sleep 1; exit 1"
